[package]
name = "hoba"
version = "0.2.0"
edition = "2021"
authors = ["kako-jun"]
license = "MIT"
description = "A minimal random number library with environmental noise monitoring."
homepage = "https://github.com/kako-jun/hoba"
repository = "https://github.com/kako-jun/hoba"
readme = "README.md"
keywords = ["random", "rng", "audio", "environment"]
categories = ["algorithms", "command-line-utilities"]
rust-version = "1.78.0"

[dependencies]
getrandom = "0.2"
rustfft = "6"
cpal = { version = "0.15", optional = true }
ringbuf = { version = "0.4", optional = true }
blake3 = { version = "1", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
dirs = { version = "5", optional = true }
fs2 = { version = "0.4", optional = true }
time = { version = "0.3", features = ["formatting", "parsing", "macros"], optional = true }
clap = { version = "4", features = ["derive"], optional = true }

[features]
default = ["mic"]
mic = ["dep:cpal", "dep:ringbuf"]
whiten = ["dep:blake3"]
log = ["dep:serde", "dep:serde_json", "dep:dirs", "dep:fs2", "dep:time"]
cli = ["log", "dep:clap"]

[[bin]]
name = "hoba"
path = "src/bin/hoba.rs"
required-features = ["cli"]
