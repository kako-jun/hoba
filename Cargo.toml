[package]
name = "hoba"
version = "0.1.0"
edition = "2021"
authors = ["kako-jun"]
license = "MIT"
description = "A minimal random number library with environmental noise monitoring."
homepage = "https://github.com/kako-jun/hoba"
repository = "https://github.com/kako-jun/hoba"
readme = "README.md"
keywords = ["random", "rng", "audio", "environment"]
categories = ["algorithms", "no-std"]
rust-version = "1.78.0"

[dependencies]
getrandom = "0.2"
rustfft = "6"
cpal = { version = "0.15", optional = true }
ringbuf = { version = "0.4", optional = true }

[features]
default = ["mic"]
mic = ["dep:cpal", "dep:ringbuf"]
