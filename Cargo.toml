[package]
name = "hoba"
version = "0.4.0"
edition = "2021"
authors = ["kako-jun"]
license = "MIT"
description = "A minimal random number library with environmental noise monitoring."
homepage = "https://github.com/kako-jun/hoba"
repository = "https://github.com/kako-jun/hoba"
readme = "README.md"
keywords = ["random", "rng", "audio", "environment"]
categories = ["algorithms", "command-line-utilities"]
rust-version = "1.78.0"

[dependencies]
getrandom = "0.2"
rustfft = "6"
cpal = { version = "0.15", optional = true }
ringbuf = { version = "0.4", optional = true }
blake3 = { version = "1", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
dirs = { version = "5", optional = true }
fs4 = { version = "1", optional = true }
time = { version = "0.3", features = ["formatting", "parsing", "macros"], optional = true }
clap = { version = "4", features = ["derive"], optional = true }

[features]
default = ["mic"]
mic = ["dep:cpal", "dep:ringbuf"]
whiten = ["dep:blake3"]
log = ["dep:serde", "dep:serde_json", "dep:dirs", "dep:fs4", "dep:time"]
cli = ["log", "mic", "dep:clap"]
# Dev-only: relocates the trigger band from 1–10 Hz infrasound up to 1–2.5 kHz
# so the detector can be exercised through ordinary speakers. Not for release
# builds — breaks the homage to the Famicom 2P mic / Hoba Eiichi.
audible-test = []

[[bin]]
name = "hoba"
path = "src/bin/hoba.rs"
required-features = ["cli"]

[[example]]
name = "babel"
required-features = ["mic"]
